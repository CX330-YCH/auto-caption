appId: com.himeditator.autocaption
productName: Auto Caption
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{LICENSE,README.md,README_en.md,README_ja.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!engine/*'
  - '!native/**'
  - '!.test-env/**'
  - '!docs/*'
  - '!assets/*'
  - '!dist/**'
  - '!.repomap/*'
  - '!.virtualme/*'
win:
  executableName: auto-caption
  icon: build/icon.png
  extraResources:
    - from: ./engine/dist/main.exe
      to: ./engine/main.exe
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
mac:
  extraResources:
    - from: ./engine/dist/main
      to: ./engine/main
    - from: ./native/apple-speech-helper/dist/apple-speech-helper
      to: ./apple-speech/apple-speech-helper
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSSpeechRecognitionUsageDescription: Application uses on-device speech recognition to create live captions.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  extraResources:
    - from: ./engine/dist/main
      to: ./engine/main
  target:
    # - AppImage
    # - snap
    # - deb
    - tar.gz
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
